name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: vet
        run: go vet ./...
      - name: build
        run: CGO_ENABLED=0 go build ./...
      - name: test
        run: go test ./...
      - name: test with race detector
        run: go test -race ./...

  ebpf:
    name: eBPF objects match source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: Install clang 18 and libbpf
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libbpf-dev
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/llvm-strip-18 /usr/local/bin/llvm-strip
          clang --version
      - name: Regenerate eBPF objects
        run: make ebpf
      - name: Committed objects are up to date
        run: git diff --exit-code -- internal/bpf/

  worker:
    name: Worker syntax check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
    - name: Syntax check
      run: node --check worker/worker.js
    - name: Worker tests
      run: node --test worker/worker.test.mjs
